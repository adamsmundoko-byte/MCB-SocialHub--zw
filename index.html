        };

        window.MCB_openMedia = function (rawUrl) {
          var embed = window.MCB_embedUrl(rawUrl);
          if (!embed) return false;

          var existing = document.getElementById('mcb-media-overlay');
          if (existing) existing.remove();

          var overlay = document.createElement('div');
          overlay.id = 'mcb-media-overlay';

          var close = document.createElement('button');
          close.id = 'mcb-media-close';
          close.type = 'button';
          close.textContent = '✕ Close - Back to MCB SocialHub';

          var frame = document.createElement('iframe');
          frame.src = embed;
          frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
          frame.setAttribute('allowfullscreen', 'true');
          frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');

          var dismiss = function () {
            overlay.remove();
            document.removeEventListener('keydown', onKey);
          };
          var onKey = function (e) {
            if (e.key === 'Escape') dismiss();
          };

          close.addEventListener('click', dismiss);
          overlay.addEventListener('click', function (e) {
            if (e.target === overlay) dismiss();
          });
          document.addEventListener('keydown', onKey);

          overlay.appendChild(close);
          overlay.appendChild(frame);
          document.body.appendChild(overlay);
          return true;
        };

        document.addEventListener(
          'click',
          function (e) {
            var anchor = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            if (!anchor) return;
            var href = anchor.getAttribute('href') || '';
            if (!MEDIA_LINK.test(href)) return;
            if (window.MCB_openMedia(href)) e.preventDefault();
          },
          true
        );

        // 8: Gallery + camera — keep both options open on phones.
        document.addEventListener(
          'click',
          function () {
            document.querySelectorAll('input[type="file"]').forEach(function (inp) {
              if (inp.hasAttribute('data-mcb-fixed')) return;
              inp.setAttribute('data-mcb-fixed', '1');
              if (!inp.getAttribute('accept')) inp.setAttribute('accept', 'image/*,video/*');
            });
          },
          true
        );

        // 3: Remove any third-party badge text, without touching the running app tree.
        var _clean = function () {
          try {
            document.querySelectorAll('body > a, body > div > a, body > section').forEach(function (el) {
              if (!el || !el.parentNode || el.id === 'root') return;
              if (el.closest('#root')) return;
              if (/made with|powered by base44/i.test(el.textContent || '')) el.remove();
            });
            document.querySelectorAll('#root [class*="made-with"], #root [id*="base44-badge"]').forEach(function (el) {
              el.remove();
            });
          } catch (err) {
            /* never let the shell break the app */
          }
        };
        setInterval(_clean, 2000);
      })();
    </script>

    <!-- 2: install prompt + offline shell -->
    <script>
      var deferredPrompt;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('mcb-install-btn').style.display = 'block';
      });
      document.getElementById('mcb-install-btn').addEventListener('click', async function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('mcb-install-btn').style.display = 'none';
      });
      window.addEventListener('appinstalled', function () {
        document.getElementById('mcb-install-btn').style.display = 'none';
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>

  </body>
</html>
